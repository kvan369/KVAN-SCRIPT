
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVAN SCRIPT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#263650;--blue:#3984ff;--muted:#a6b5cb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:25px 18px;text-align:center;background:#0d1628;border-bottom:1px solid var(--line)}
.logo{font-size:30px;font-weight:900;letter-spacing:2px}
.logo span{color:#4c91ff}
header p{color:var(--muted);margin:9px 0 0}
main{max-width:1100px;margin:auto;padding:22px 16px}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,textarea,button{font:inherit;border-radius:9px;padding:12px;border:1px solid var(--line)}
input,textarea{background:#0b1322;color:white;width:100%;min-width:0}
#search{flex:1;min-width:190px}
button{cursor:pointer;background:var(--blue);border:0;color:white;font-weight:bold}
button.secondary{background:#24334b}
button.danger{background:#b93249}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thumb{width:100%;height:155px;object-fit:cover;background:#17243a;display:block}
.cardbody{padding:15px}
.tag{display:inline-block;color:#9cc4ff;background:#1b3152;padding:5px 8px;border-radius:6px;font-size:12px}
h3{margin:12px 0 7px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;padding:10px}
.panel{margin:20px 0;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.panel h2{margin-top:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{min-height:130px;resize:vertical}
.full{grid-column:1/-1}
.hidden{display:none!important}
#status{color:#9cc4ff;margin:12px 0;overflow-wrap:anywhere}
footer{text-align:center;color:var(--muted);padding:25px}
@media(max-width:520px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<div class="logo">KVAN <span>SCRIPT</span></div>
<p>Discover • View • Copy Roblox Scripts</p>
</header>
<main>
<div class="top">
<input id="search" placeholder="Search scripts or games...">
<button class="secondary" id="loginToggle">Owner Login</button>
</div>

<section id="loginPanel" class="panel hidden">
<h2>Owner Login</h2>
<div class="fields">
<input id="email" type="email" placeholder="Owner email">
<input id="password" type="password" placeholder="Password">
</div>
<div class="actions">
<button id="loginBtn">Log In</button>
<button class="secondary hidden" id="logoutBtn">Log Out</button>
</div>
</section>

<section id="adminPanel" class="panel hidden">
<h2>Add a Script</h2>
<form id="scriptForm" class="fields">
<input id="scriptName" placeholder="Script name" required>
<input id="gameName" placeholder="Game name" required>
<input id="category" placeholder="Category (e.g. Utility)" required>
<input id="thumbnail" type="url" placeholder="Thumbnail image URL (optional)">
<textarea id="scriptCode" class="full" placeholder="Paste script code here..." required></textarea>
<button class="full" type="submit">Publish Script</button>
</form>
<p class="muted">Use an image URL for the thumbnail. Only publish scripts you have permission to share.</p>
</section>

<p id="status">Loading scripts...</p>
<section id="scriptGrid" class="grid"></section>
</main>
<footer>KVAN SCRIPT © 2026</footer>

<script>
const SUPABASE_URL = "https://xfevvgiqezbwimutjkyu.supabase.co";
const SUPABASE_KEY = "sb_publishable_0N5QfJ3en7QDyyo4oEBiNQ_WXYk0RBU";
const OWNER_UID = "53a31555-be18-47e7-a9d4-ae51bd0de554";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let scripts = [];

const $ = id => document.getElementById(id);
const status = message => $("status").textContent = message;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function safeImage(url) {
  try {
    const parsed = new URL(url);
    return ["https:","http:"].includes(parsed.protocol) ? parsed.href : "";
  } catch { return ""; }
}

async function loadScripts() {
  status("Loading scripts...");
  const { data, error } = await client
    .from("scripts")
    .select("*")
    .order("created_at", { ascending:false });

  if (error) {
    status("Could not load scripts: " + error.message);
    return;
  }
  scripts = data || [];
  renderScripts();
}

function renderScripts() {
  const term = $("search").value.trim().toLowerCase();
  const found = scripts.filter(s =>
    [s.script_name,s.game_name,s.category]
      .some(v => String(v || "").toLowerCase().includes(term))
  );

  $("scriptGrid").innerHTML = "";
  if (!found.length) {
    status(scripts.length ? "No matching scripts found." : "No scripts published yet.");
    return;
  }

  status(found.length + " script(s) found.");

  found.forEach(s => {
    const card = document.createElement("article");
    card.className = "card";
    const image = safeImage(s.thumbnail_url);

    card.innerHTML = `
      ${image
        ? `<img class="thumb" src="${escapeHTML(image)}" alt="${escapeHTML(s.script_name)} thumbnail" loading="lazy">`
        : `<div class="thumb" style="display:grid;place-items:center;color:#9bb4d8">KVAN SCRIPT</div>`}
      <div class="cardbody">
        <span class="tag">${escapeHTML(s.category)}</span>
        <h3>${escapeHTML(s.script_name)}</h3>
        <div class="muted">Game: ${escapeHTML(s.game_name)}</div>
        <div class="actions">
          <button class="viewBtn">View Code</button>
          <button class="copyBtn">Copy</button>
        </div>
        ${currentUser && currentUser.id === OWNER_UID
          ? `<div class="actions"><button class="danger deleteBtn">Delete</button></div>` : ""}
        <pre class="code hidden" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#080d18;padding:10px;border-radius:8px;max-height:260px;overflow:auto"></pre>
      </div>`;

    const code = card.querySelector(".code");
    code.textContent = s.script_code || "";

    card.querySelector(".viewBtn").onclick = () => code.classList.toggle("hidden");

    card.querySelector(".copyBtn").onclick = async event => {
      try {
        await navigator.clipboard.writeText(s.script_code || "");
        event.currentTarget.textContent = "Copied!";
        setTimeout(() => event.currentTarget.textContent = "Copy", 1300);
      } catch {
        code.classList.remove("hidden");
        status("Select and copy the code manually.");
      }
    };

    const deleteBtn = card.querySelector(".deleteBtn");
    if (deleteBtn) deleteBtn.onclick = async () => {
      if (!confirm("Delete this script?")) return;
      const { error } = await client.from("scripts").delete().eq("id",s.id);
      if (error) {
        status("Delete failed: " + error.message);
        return;
      }
      await loadScripts();
    };

    $("scriptGrid").appendChild(card);
  });
}

$("search").addEventListener("input", renderScripts);
$("loginToggle").onclick = () => $("loginPanel").classList.toggle("hidden");

$("loginBtn").onclick = async () => {
  const { data, error } = await client.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if (error) {
    status("Login failed: " + error.message);
    return;
  }
  currentUser = data.user;
  await updateOwnerUI();
};

$("logoutBtn").onclick = async () => {
  const { error } = await client.auth.signOut();
  if (error) {
    status("Logout failed: " + error.message);
    return;
  }
  currentUser = null;
  await updateOwnerUI();
};

async function updateOwnerUI() {
  const isOwner = !!currentUser && currentUser.id === OWNER_UID;
  $("adminPanel").classList.toggle("hidden", !isOwner);
  $("logoutBtn").classList.toggle("hidden", !currentUser);
  $("loginBtn").classList.toggle("hidden", !!currentUser);
  $("email").disabled = !!currentUser;
  $("password").disabled = !!currentUser;
  $("loginToggle").textContent = currentUser ? "Account" : "Owner Login";

  if (currentUser && !isOwner) {
    status("This account is not the site owner.");
  }
  await loadScripts();
}

$("scriptForm").onsubmit = async event => {
  event.preventDefault();

  if (!currentUser || currentUser.id !== OWNER_UID) {
    status("Please log in with the owner account.");
    return;
  }

  const record = {
    script_name:$("scriptName").value.trim(),
    game_name:$("gameName").value.trim(),
    category:$("category").value.trim(),
    thumbnail_url:$("thumbnail").value.trim() || null,
    script_code:$("scriptCode").value
  };

  const { error } = await client.from("scripts").insert(record);
  if (error) {
    status("Publish failed: " + error.message);
    return;
  }

  $("scriptForm").reset();
  status("Script published successfully!");
  await loadScripts();
};

(async function init() {
  const { data } = await client.auth.getSession();
  currentUser = data.session?.user || null;
  await updateOwnerUI();
})();
</script>
</body>
</html>
