
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVAN SCRIPT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090d18;
  color: white;
}
header {
  background: #111b30;
  text-align: center;
  padding: 32px 15px;
  border-bottom: 2px solid #1688ff;
}
h1 { color: #54baff; }
header p { color: #c1cee0; }
main { max-width: 850px; margin: auto; padding: 20px; }
input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #344968;
  background: #131e32;
  color: white;
  font-size: 16px;
}
.card {
  background: #131e32;
  border: 1px solid #2d4262;
  border-radius: 12px;
  padding: 18px;
  margin: 16px 0;
}
.card h3 { color: #65c4ff; }
.card p { color: #c7d2e2; line-height: 1.6; }
pre {
  background: #080b12;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #8cf0b2;
}
button {
  background: #1688ff;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
}
footer {
  text-align: center;
  padding: 25px;
  color: #9aaac1;
}
</style>
</head>
<body>
<header>
  <h1>KVAN SCRIPT</h1>
  <p>Roblox Studio Scripts & Tutorials</p>
</header>

<main>
  <h2>Find Scripts</h2>
  <input id="search" placeholder="Search scripts...">

  <select id="filter">
    <option value="all">All Categories</option>
    <option value="Beginner">Beginner</option>
    <option value="Gameplay">Gameplay</option>
    <option value="UI">UI</option>
  </select>

  <div id="list"></div>
</main>

<footer>KVAN SCRIPT | Fan-made Roblox resource</footer>

<script>
const scripts = [
 {
  title: "Welcome Message",
  category: "Beginner",
  description: "Print a welcome message when a player joins your game.",
  code: `game.Players.PlayerAdded:Connect(function(player)
    print("Welcome, " .. player.Name)
end)`
 },
 {
  title: "Walk Speed",
  category: "Gameplay",
  description: "Set a player's default walking speed in your own game.",
  code: `local Players = game:GetService("Players")

Players.PlayerAdded:Connect(function(player)
    player.CharacterAdded:Connect(function(character)
        local humanoid = character:WaitForChild("Humanoid")
        humanoid.WalkSpeed = 20
    end)
end)`
 },
 {
  title: "UI Button",
  category: "UI",
  description: "Print a message when a Roblox Studio GUI button is clicked.",
  code: `local button = script.Parent

button.Activated:Connect(function()
    print("Button clicked!")
end)`
 }
];

function showScripts() {
  const query = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("filter").value;
  const list = document.getElementById("list");
  list.replaceChildren();

  const results = scripts.filter(s =>
    (s.title + s.description + s.category).toLowerCase().includes(query) &&
    (category === "all" || s.category === category)
  );

  if (!results.length) {
    list.textContent = "No scripts found.";
    return;
  }

  results.forEach(s => {
    const card = document.createElement("section");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = s.title;

    const tag = document.createElement("small");
    tag.textContent = s.category;

    const desc = document.createElement("p");
    desc.textContent = s.description;

    const code = document.createElement("pre");
    code.textContent = s.code;

    const button = document.createElement("button");
    button.textContent = "Copy Code";
    button.onclick = async () => {
      try {
        await navigator.clipboard.writeText(s.code);
        button.textContent = "Copied!";
      } catch {
        button.textContent = "Please select and copy the code";
      }
    };

    card.append(title, tag, desc, code, button);
    list.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", showScripts);
document.getElementById("filter").addEventListener("change", showScripts);
showScripts();
</script>
</body>
</html>
